# Development profile: persistent H2 file storage in backend/data/
spring.datasource.url=jdbc:h2:file:${STUDYFLOW_H2_PATH:./data/studyflow};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 native ENUM values are not expanded by Hibernate's update strategy.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/dev-migrations.sql

# Development-only database console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
