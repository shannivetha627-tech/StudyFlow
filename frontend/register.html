<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Create an account for StudyFlow – Student Productivity &amp; Study Management System.">
  <title>Create account | StudyFlow – Student Productivity &amp; Study Management System</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("studyflow_theme") === "light" ? "light" : "dark";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth-container wide">
    <button class="auth-theme-toggle" id="auth-theme-toggle" type="button" aria-pressed="false">Switch to light mode</button>
    <a class="auth-brand brand" href="#" aria-label="StudyFlow home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M7 8.5c0-1.1.9-2 2-2h6.2c1.4 0 2.8.6 3.8 1.6l.5.5.5-.5c1-1 2.4-1.6 3.8-1.6H25c1.1 0 2 .9 2 2v14c0 .8-.7 1.5-1.5 1.5h-3.7c-1.3 0-2.5.5-3.4 1.4l-.9.9-.9-.9c-.9-.9-2.1-1.4-3.4-1.4H8.5c-.8 0-1.5-.7-1.5-1.5v-14Z"/><path d="M16 9v15"/></svg>
      </span>
      <span class="brand-name">studyflow<span>.</span></span>
    </a>

    <main class="auth-card">
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Join StudyFlow to manage personal study tasks and keep track of deadlines.</p>

      <div class="auth-alert error" id="auth-alert" role="alert" hidden></div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="auth-field">
          <label for="reg-name">Full name</label>
          <input
            id="reg-name"
            name="fullName"
            type="text"
            placeholder="e.g. Maya Lin"
            autocomplete="name"
            required
            autofocus
          >
        </div>

        <div class="form-row">
          <div class="auth-field">
            <label for="reg-email">Email address</label>
            <input
              id="reg-email"
              name="email"
              type="email"
              placeholder="e.g. maya@example.com"
              autocomplete="email"
              required
            >
          </div>
          <div class="auth-field">
            <label for="reg-phone">Phone number</label>
            <input
              id="reg-phone"
              name="phoneNumber"
              type="tel"
              placeholder="e.g. +14155552671"
              autocomplete="tel"
              required
            >
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-password">
            <span>Password</span>
            <span class="field-hint">Min 8 chars with letter, digit & symbol</span>
          </label>
          <div class="input-with-button">
            <input
              id="reg-password"
              name="password"
              type="password"
              placeholder="Create a strong password"
              autocomplete="new-password"
              required
            >
            <button
              class="password-toggle-btn"
              type="button"
              data-toggle-password="reg-password"
              aria-label="Show password"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="strength-bars" id="strength-bars" aria-hidden="true">
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
            </div>
            <span class="strength-text" id="strength-text">Use at least 8 characters with letters, numbers & symbols</span>
          </div>
        </div>

        <div class="auth-field">
          <label for="reg-confirm-password">Confirm password</label>
          <div class="input-with-button">
            <input
              id="reg-confirm-password"
              name="confirmPassword"
              type="password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <button
              class="password-toggle-btn"
              type="button"
              data-toggle-password="reg-confirm-password"
              aria-label="Show confirm password"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="auth-submit-btn" id="register-btn" type="submit">
          <span>Create account</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </main>
  </div>
</body>
</html>
