spring.application.name=student-productivity
spring.profiles.default=dev
spring.profiles.group.railway=prod,mysql
server.port=${PORT:8080}
spring.flyway.enabled=false

spring.jpa.open-in-view=false

# Session and cookie security configuration
app.security.secure-cookies=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Jackson property coercion: treat empty strings as null for optional fields
spring.jackson.deserialization.accept-empty-string-as-null-object=true

studyflow.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
studyflow.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
studyflow.push.vapid-subject=${VAPID_SUBJECT:}
